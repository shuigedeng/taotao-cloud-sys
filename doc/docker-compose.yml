services:
  mysql-8.4:
    hostname: mysql-8.4
    container_name: mysql-8.4
    image: mysql:8.4
    restart: no
    privileged: true
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: master
      MYSQL_PASSWORD: 123456
    command:
      --bind-address=172.11.0.10
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone='+8:00'
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.10

  redis-7.4.0:
    image: redis:7.4.0
    container_name: redis-7.4.0
    restart: no
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    #command: [ "redis-server","/etc/redis/redis.conf" ]
    #    restart: always
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.12

  nacos-3.2.2:
    image: nacos/nacos-server:v3.2.2
    restart: no
    container_name: nacos-3.2.2
    privileged: true
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: 172.11.0.10
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: 123456
      MYSQL_SERVICE_DB_NAME: "nacos3.2.2"
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: true
      NACOS_AUTH_TOKEN: SecretKey01234567890123456789012345345678999987654901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.13

  openobserve:
    image: o2cr.ai/openobserve/openobserve-enterprise:latest
    container_name: openobserve
    restart: no
    environment:
      ZO_ROOT_USER_EMAIL: "981376577@qq.com"  # 替换为你的邮箱
      ZO_ROOT_USER_PASSWORD: "Complexpass#123" # 替换为你的强密码
    ports:
      - "5080:5080"
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.50

  xxl-job-admin-3.4.2:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: xxl-job-admin-3.4.2
    restart: no
    ports:
      - "48080:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://172.11.0.10:3306/xxl_job_3.4.2?useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=123456
        --xxl.job.accessToken=123456
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.27

  opentelemetry-collector-0.156.0:
    image: otel/opentelemetry-collector-contrib:0.156.0
    container_name: opentelemetry-collector-0.156.0
    restart: no
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "55679:55679" # ZPages endpoint
      - "8889:8889" # ZPages endpoint
    volumes:
      - ./dockervolumes/opentelemetry/opentelemetry-config.yaml:/etc/otelcol/config.yaml
    command: [ "--config", "/etc/otelcol/config.yaml" ]
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.31

  rocketmq-nameserv-5.5.0:
    image: apache/rocketmq:5.5.0
    container_name: rocketmq-nameserv-5.5.0
    ports:
      - "9876:9876"
    restart: no
    privileged: true
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 256M
      TZ: Asia/Shanghai
    command: [ "sh","mqnamesrv" ]
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.19
  rocketmq-broker-5.5.0:
    image: apache/rocketmq:5.5.0
    container_name: rocketmq-broker-5.5.0
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    restart: no
    privileged: true
    depends_on:
      - 'rocketmq-nameserv-5.5.0'
    environment:
      NAMESRV_ADDR: 172.11.0.19:9876
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 256M
    volumes:
      - ./dockervolumes/rocketmq5.5.0/broker/broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/broker.conf
      - ./dockervolumes/rocketmq5.5.0/broker/tools.yml:/home/rocketmq/rocketmq-5.5.0/conf/tools.yml
    command: [ "sh","mqbroker","-c","/home/rocketmq/rocketmq-5.5.0/conf/broker.conf " ]
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.20
  rocketmq-proxy-5.5.0:
    image: apache/rocketmq:5.5.0
    container_name: rocketmq-proxy-5.5.0
    restart: no
    depends_on:
      - 'rocketmq-nameserv-5.5.0'
      - 'rocketmq-broker-5.5.0'
    ports:
      - 18680:18680
      - 18681:18681
    volumes:
      - ./dockervolumes/rocketmq5.5.0/proxy/rmq-proxy.json:/home/rocketmq/rocketmq-5.5.0/conf/rmq-proxy.json
      - ./dockervolumes/rocketmq5.5.0/broker/tools.yml:/home/rocketmq/rocketmq-5.5.0/conf/tools.yml
    environment:
      NAMESRV_ADDR: 172.11.0.19:9876
    command: sh mqproxy -pc /home/rocketmq/rocketmq-5.5.0/conf/rmq-proxy.json
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.70
  rocketmq-dashboard-2.1.0:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    container_name: rocketmq-dashboard-2.1.0
    ports:
      - "8082:8082"
    restart: no
    privileged: true
    volumes:
      # 数据目录映射, user.properties需要放在data目录下
      - ./dockervolumes/rocketmq5.5.0/dashboard/users.properties:/tmp/rocketmq-console/data/users.properties
    depends_on:
      - 'rocketmq-nameserv-5.5.0'
      - 'rocketmq-broker-5.5.0'
    environment:
      JAVA_OPTS: '-Xmx256M -Xms256M -Xmn128M -Drocketmq.namesrv.addr=172.11.0.19:9876 -Drocketmq.config.proxyAddrs=172.11.0.70:18680 -Dcom.rocketmq.sendMessageWithVIPChannel=false -Drocketmq.config.loginRequired=true -Drocketmq.config.accessKey=taotaocloud -Drocketmq.config.secretKey=taotaocloud'
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.21

  zookeeper-3.9.5:
    image: zookeeper:3.9.5
    container_name: zookeeper-3.9.5
    restart: no
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.26

  kafka-4.3.0:
    image: apache/kafka:4.3.0
    container_name: kafka-4.3.0
    restart: no
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@172.11.0.24:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://172.11.0.24:9092,PLAINTEXT_HOST://127.0.0.1:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.24
  kafka-ui-0.7.2:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui-0.7.2
    restart: no
    ports:
      - "28080:8080"
    environment:
      # 集群名称
      - KAFKA_CLUSTERS_0_NAME=kafkaCluster
      # 集群地址
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=172.11.0.24:9092
      - DYNAMIC_CONFIG_ENABLED=true
      - AUTH_TYPE=LOGIN_FORM
      - SPRING_SECURITY_USER_NAME=admin
      - SPRING_SECURITY_USER_PASSWORD=123456
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.25

  doris-fe-4.1.3:
    image: apache/doris:fe-4.1.3
    container_name: doris-fe-4.1.3
    hostname: doris-fe-4.1.3
    restart: no
    working_dir: /opt/apache-doris
    environment:
      FE_SERVERS: fe1:172.11.0.80:9010
      FE_ID: "1"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        sed -i 's/-Xmx8192m/-Xmx1200m/g' /opt/apache-doris/fe/conf/fe.conf
        sed -i 's/-Xms8192m/-Xms1200m/g' /opt/apache-doris/fe/conf/fe.conf
        exec bash init_fe.sh
    volumes:
      - ./dockervolumes/doris/fe-meta:/opt/apache-doris/fe/doris-meta
    ports:
      - "8030:8030"
      - "9030:9030"
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.80
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9030' && curl -sf http://127.0.0.1:8030/api/bootstrap"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
  doris-be-4.1.3:
    image: apache/doris:be-4.1.3
    container_name: doris-be-4.1.3
    hostname: doris-be-4.1.3
    restart: no
    working_dir: /opt/apache-doris
    environment:
      FE_SERVERS: fe1:172.11.0.80:9010
      BE_ADDR: 172.11.0.81:9050
      BE_MAX_MEMORY_LIMIT: "4G"
    depends_on:
      doris-fe-4.1.3:
        condition: service_healthy
    volumes:
      - ./dockervolumes/doris/be-storage:/opt/apache-doris/be/storage
    ports:
      - "8040:8040"
    networks:
      taotao-cluster-network:
        ipv4_address: 172.11.0.81
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8040/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

