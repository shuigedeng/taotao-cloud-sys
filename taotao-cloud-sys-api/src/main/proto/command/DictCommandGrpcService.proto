syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/type.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

package com.taotao.cloud.sys.api.grpc;

option java_multiple_files = true;
option java_package = "com.taotao.cloud.sys.api.grpc";
option java_outer_classname = "DictCommandGrpcServiceProto";
//option objc_class_prefix = "HLW";

import "dto/command/DictCommand.proto";
import "dto/response/DictResponse.proto";

service DictCommandGrpcService {
  rpc create (CreateDictGrpcCommand) returns (DictGrpcResponse){}
}

