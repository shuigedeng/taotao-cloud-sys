syntax = "proto3";

package com.taotao.cloud.sys.api.grpc;

option java_multiple_files = true;
option java_package = "com.taotao.cloud.sys.api.grpc.dto.response";
option java_outer_classname = "DictResponseProto";
//option objc_class_prefix = "HLW";

message DictGrpcResponse {
  int64 id = 1;
  string dictName = 2;
  string dictCode = 3;
  string description = 4;
  int32 sortNum = 5;
  string remark = 6;
}

